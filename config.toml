onboarding = false

[keys]
prefix = "ctrl+a"
split_vertical = ["prefix+backslash", "prefix+shift+backslash"]
split_horizontal = "prefix+minus"
toggle_sidebar = "prefix+a"
zoom = "prefix+m"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[ui.toast]
delivery = "system"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
status_indicators = "symbols"
