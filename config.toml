onboarding = false

[keys]
prefix = "ctrl+a"
split_vertical = ["prefix+backslash", "prefix+shift+backslash"]
split_horizontal = "prefix+minus"
toggle_sidebar = "prefix+a"
zoom = "prefix+m"
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"
switch_tab = ["prefix+1..9", "alt+1..9"]

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "alt+0"
type = "shell"
command = "${HERDR_BIN_PATH:-herdr} tab list --workspace ${HERDR_ACTIVE_WORKSPACE_ID} | jq -r '.result.tabs[] | select(.number == 10) | .tab_id' | xargs -r -I{} ${HERDR_BIN_PATH:-herdr} tab focus {}"
description = "switch to tab 10"

[ui.toast]
delivery = "system"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
status_indicators = "symbols"
